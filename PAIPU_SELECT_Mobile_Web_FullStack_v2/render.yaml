services:
  - type: web
    name: paipu-select
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps 'git+https://github.com/LekangZou/Mahjong-Replay-Converter.git@main'
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: PUBLIC_HTTPS
        value: '1'
