name: Offline protocol and selection checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest PAIPU_SELECT_Mobile_Web_FullStack_v2/tests -q
      - run: node PAIPU_SELECT_Mobile_Web_FullStack_v2/tests/check.js
      - run: node PAIPU_SELECT_Mobile_Web_FullStack_v2/tests/check-share.js
